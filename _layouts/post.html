---
layout: default
---
<main id="main">
    <article class="post" aria-labelledby="page-title">
      <div class="page-hero">
        <div class="wrap">
          <div>
            <p class="kicker">Farm notes · From the rows at Bramblecut</p>
            <h1 id="page-title">{{ page.title | escape }}</h1>
            <p class="lede">{{ page.description | escape }}</p>
            <p class="post-meta"><span>Written after chores</span><span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span></p>
          </div>
          <p class="stamp stamp--round">Written<strong>Wed.</strong>packed Thurs.</p>
        </div>
      </div>

      <div class="wrap post-wrap">
        <figure class="post-lead">
          <img src="{{ '/assets/img/hills.svg' | relative_url }}" alt="Screenprint of the Bramblecut hollow at sunrise: the red barn, a silo, and the striped rows of the south slope" width="1440" height="320">
        </figure>

        <div class="post-body">
          {{ content }}
        </div>

        <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All farm notes</a></p>
      </div>
    </article>
  </main>
